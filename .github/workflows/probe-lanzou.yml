name: Probe Lanzou
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright + Chromium
        run: |
          npm init -y >/dev/null
          npm i playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          echo "playwright ready"

      - name: Download via real browser
        run: |
          cat > probe.js <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const ctx = await browser.newContext({
              userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Safari/537.36',
              referer: 'https://www.diskgenius.cn/',
            });
            const page = await ctx.newPage();
            console.log('goto share page...');
            await page.goto('https://eassos.lanzoue.com/DG64', { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.waitForTimeout(3000);

            // find the /fn? iframe and its download link
            let frame = page.frames().find(f => f.url().includes('/fn?'));
            if (!frame) {
              console.log('no fn iframe yet, frames:', page.frames().map(f => f.url().slice(0, 60)));
              await page.waitForTimeout(5000);
              frame = page.frames().find(f => f.url().includes('/fn?'));
            }
            if (!frame) throw new Error('fn iframe not found');
            console.log('fn frame ok:', frame.url().slice(0, 50));

            const link = frame.locator('a', { hasText: '下载' }).first();
            await link.waitFor({ timeout: 15000 });
            console.log('download link visible, clicking...');

            const [download] = await Promise.all([
              page.waitForEvent('download', { timeout: 90000 }),
              link.click(),
            ]);
            console.log('download event:', download.suggestedFilename());
            await download.saveAs('/tmp/DG6201829_x64.zip');
            const fs = require('fs');
            const size = fs.statSync('/tmp/DG6201829_x64.zip').size;
            console.log('saved size:', size);
            if (size < 1000000) throw new Error('file too small: ' + size);
            console.log('SUCCESS');
            await browser.close();
          })().catch(e => { console.error('FAIL:', e.message); process.exit(1); });
          EOF
          node probe.js

      - name: Compute hash
        if: success()
        run: |
          ls -la /tmp/DG6201829_x64.zip
          sha256sum /tmp/DG6201829_x64.zip
          file /tmp/DG6201829_x64.zip
