name: Probe Lanzou
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install playwright-core + xvfb
        run: |
          npm init -y >/dev/null && npm i playwright-core >/dev/null 2>&1
          sudo apt-get install -y xvfb >/dev/null 2>&1 || true
          echo ok

      - name: Download with challenge auto-click
        run: |
          cat > dl.cjs <<'EOF'
          const { chromium } = require('playwright-core');
          (async () => {
            const browser = await chromium.launch({ channel: 'chrome', headless: false });
            const ctx = await browser.newContext({
              userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Safari/537.36',
              extraHTTPHeaders: { Referer: 'https://www.diskgenius.cn/' },
            });
            const page = await ctx.newPage();
            await page.goto('https://eassos.lanzoue.com/DG64', { waitUntil: 'domcontentloaded', timeout: 45000 });
            await page.waitForTimeout(3000);

            let frame = page.frames().find(f => f.url().includes('/fn?'));
            if (!frame) { await page.waitForTimeout(5000); frame = page.frames().find(f => f.url().includes('/fn?')); }
            if (!frame) throw new Error('fn iframe not found');
            const href = await frame.locator('a').first().getAttribute('href');
            if (!href) throw new Error('no href');
            console.log('href ok');

            const p2 = await ctx.newPage();
            const dlP = p2.waitForEvent('download', { timeout: 60000 }).catch(() => null);
            let challenge = false;
            try {
              await p2.goto(href, { timeout: 30000 });
              challenge = true;
              console.log('challenge page hit, clicking verify button...');
            } catch (e) {
              console.log('goto threw (maybe download starting):', e.message.slice(0, 60));
            }

            if (challenge) {
              // click the verify-and-download button like a real user
              const btn = p2.locator('div[onclick^="down_r"]').first();
              await btn.waitFor({ timeout: 10000 });
              const dlP2 = p2.waitForEvent('download', { timeout: 60000 }).catch(() => null);
              await btn.click();
              console.log('verify clicked, waiting for download or link...');
              // success path replaces #go with <a href=url>; watch for both
              try {
                await p2.waitForTimeout(4000);
                const goLink = p2.locator('#go a').first();
                if (await goLink.count() > 0) {
                  const realUrl = await goLink.getAttribute('href');
                  console.log('got real url after verify:', (realUrl || '').slice(0, 70));
                  const dlP3 = p2.waitForEvent('download', { timeout: 90000 }).catch(() => null);
                  try { await p2.goto(realUrl, { timeout: 30000 }); } catch {}
                  const d3 = await dlP3;
                  if (d3) {
                    await d3.saveAs('/tmp/DG6201829_x64.zip');
                    console.log('SUCCESS(via link) size=' + require('fs').statSync('/tmp/DG6201829_x64.zip').size);
                    await browser.close(); return;
                  }
                }
              } catch (e) { console.log('link path:', e.message.slice(0, 60)); }
              const d2 = await dlP2;
              if (d2) {
                await d2.saveAs('/tmp/DG6201829_x64.zip');
                console.log('SUCCESS(direct) size=' + require('fs').statSync('/tmp/DG6201829_x64.zip').size);
                await browser.close(); return;
              }
              throw new Error('no download after verify click; page title=' + await p2.title());
            } else {
              const d = await dlP;
              if (!d) throw new Error('no download event');
              await d.saveAs('/tmp/DG6201829_x64.zip');
              console.log('SUCCESS size=' + require('fs').statSync('/tmp/DG6201829_x64.zip').size);
              await browser.close();
            }
          })().catch(e => { console.error('FAIL:', e.message); process.exit(1); });
          EOF
          xvfb-run -a node dl.cjs

      - name: Hash
        if: success()
        run: sha256sum /tmp/DG6201829_x64.zip && file /tmp/DG6201829_x64.zip
